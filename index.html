<script>

function parseLL(t){
 try{t=decodeURIComponent(t)}catch(e){}
 const N="(-?\\d{1,3}\\.\\d+)",ya=/yandex/.test(t);let m,a=null,b=null;
 if(m=t.match(new RegExp("[?&](?:pt|ll)="+N+","+N))){if(ya){a=m[2];b=m[1]}else{a=m[1];b=m[2]}}
 else if(m=t.match(new RegExp("@"+N+","+N))){a=m[1];b=m[2]}
 else if(m=t.match(new RegExp("!3d"+N+"!4d"+N))){a=m[1];b=m[2]}
 else if(m=t.match(new RegExp(N+"[,\\s]+"+N))){a=m[1];b=m[2]}
 if(a==null)return null;
 a=+a;b=+b;if(Math.abs(a)>90){const x=a;a=b;b=x}
 return Math.abs(a)<=90&&Math.abs(b)<=180?{lat:a,lng:b}:null;
}

function parseDays(v){
 const o=new Set();
 String(v||"").toLowerCase().replace(/[ʻ’'`‘]/g,"").split(/[,;\/\s]+/).forEach(t=>{

  if(/^[1-7]$/.test(t)){o.add(+t-1);return}

 });

 ["phone","lat","lng","coord","day","address","name"].forEach(k=>{

 });
 if(col.name<0){col={name:0,phone:1,address:2,day:3,lat:-1,lng:-1,coord:-1};start=0}
 const out=[];imSkip=0;
 for(let i=start;i<rows.length;i++){

  const name=g("name");if(!name){imSkip++;continue}

function agStat(a){
 const td=dk(new Date()),dl=Math.round((Date.parse(a.paid_until)-Date.parse(td))/864e5),full=!!a.active&&(a.lifetime||dl>=0);
 let t,c="var(--ok)";
 if(!a.active){t="Bloklangan";c="var(--dg)"}
 else if(a.lifetime)t="♾ Umrbod premium";
 else if(dl>=0){const tr=a.paid_until<=dk(new Date(Date.parse(a.created_at)+7*864e5));t=(tr?"Sinov":"Obuna")+": "+(dl?dl+" kun qoldi":"bugun tugaydi")+" ("+a.paid_until+")";if(dl<=3)c="var(--am)"}
 else{t="Bepul rejim (muddat tugagan: "+a.paid_until+")";c="var(--dg)"}
 return{t,c,full};
}
async function loadAg(){
 const{data,error}=await sb.rpc("owner_stats");
 if(error){$("#ol").innerHTML='<p class="em">Yuklab boʻlmadi. SQL yangilanishi ishga tushirilganmi?</p>';return}
 const sm='style="font-weight:400;font-size:13px;color:var(--mu)"';
 $("#ol").innerHTML=data.length?data.map(a=>{
  const g=agStat(a),lock=!g.full&&a.active&&a.shops_count>50?` · ${a.shops_count-50} ta qulflangan`:"";
  return `<div class="c" data-id="${a.agent_id}" data-lg="${esc(a.login)}" data-pu="${a.paid_until}" data-ac="${a.active}" data-lt="${a.lifetime}"><div class="r" style="cursor:default"><div class="nm" style="white-space:normal">${esc(a.full_name||a.login)}<div ${sm}>${esc(a.login)} · ${a.shops_count} doʻkon${lock} · 30 kunda ${a.visits_30d} tashrif</div><div style="font-weight:400;font-size:13px;color:${g.c}">${esc(g.t)}</div></div></div><div class="mo"><button class="sb" data-o="d1">+1</button><button class="sb" data-o="d7">+7</button><button class="sb" data-o="d30">+30</button><button class="sb" data-o="l">${a.lifetime?"♾ Olish":"♾ Umrbod"}</button><button class="sb" data-o="b">${a.active?"Bloklash":"Faollashtirish"}</button><button class="sb" data-o="p">Parol</button></div></div>`}).join(""):'<p class="em">Agent yoʻq. Yuqoridagi forma bilan qoʻshing.</p>';
}
$("#ag").onclick=()=>{$("#om").hidden=false;loadAg()};
$("#oc").onclick=()=>{$("#om").hidden=true};
$("#ol").onclick=e=>{
 const b=e.target.closest("[data-o]");if(!b)return;
 const c=b.closest(".c"),id=c.dataset.id,o=b.dataset.o;
 if(o=="p")return ask("Yangi parol yaratilsinmi?","Eski parol ishlamay qoladi. Yangisi bir marta koʻrsatiladi.","Ha, yaratilsin",()=>resetPw(id,c.dataset.lg));
 const go=async()=>{
  let u;
  if(o[0]=="d"){const n=+o.slice(1),td=dk(new Date()),base=c.dataset.pu>td?c.dataset.pu:td,d=new Date(base+"T12:00:00");d.setDate(d.getDate()+n);u={paid_until:dk(d)}}
  else if(o=="l")u={lifetime:c.dataset.lt!="true"};
  else u={active:c.dataset.ac!="true"};
  const{error}=await sb.from("profiles").update(u).eq("id",id);
  if(error)return toast("Xatolik: "+error.message);
  toast("Saqlandi");loadAg();
 };
 if(o=="b"&&c.dataset.ac=="true")ask("Agent bloklansinmi?","U ilovaga kira olmaydi.","Ha, bloklansin",go);else go();
};
boot();
</script></body></html>
